<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task Planner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f1f7f4;
            font-family: Arial, sans-serif;
            color: #303d39;
        }

        .header {
            background: #554b78;
            color: white;
            padding: 25px 0;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .planner {
            max-width: 700px;
            margin: 40px auto;
            padding: 28px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(40, 50, 45, 0.08);
        }

        .planner h2 {
            font-size: 23px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #718078;
            margin-bottom: 25px;
        }

        .task-input {
            display: flex;
            gap: 10px;
        }

        .task-input input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #d6e0da;
            border-radius: 8px;
        }

        .add-btn {
            background: #554b78;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
        }

        .add-btn:hover {
            background: #40365f;
        }

        .task-summary {
            display: flex;
            justify-content: space-between;
            margin: 25px 0 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5ebe7;
        }

        #taskCount {
            background: #e6e0f4;
            color: #554b78;
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 13px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            margin-bottom: 10px;
            background: #f5f8f6;
            border-radius: 9px;
        }

        .task-text {
            flex: 1;
            overflow-wrap: anywhere;
            cursor: pointer;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #87928c;
        }

        .delete-btn {
            border: none;
            background: #f9e5e5;
            color: #a23c3c;
            border-radius: 6px;
            padding: 6px 10px;
        }

        .empty-message {
            text-align: center;
            color: #87928c;
            padding: 25px 5px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #718078;
        }

        @media (max-width: 500px) {
            .planner {
                margin: 25px 12px;
                padding: 20px;
            }

            .task-input {
                flex-direction: column;
            }

            .add-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="container">
            <h1>Daily Task Planner</h1>
            <p class="mb-0">Small tasks, steady progress.</p>
        </div>
    </header>

    <main class="container">
        <section class="planner">
            <h2>My Tasks ✨</h2>
            <p class="subtitle">Write down what you want to get done today.</p>

            <form id="taskForm">
                <div class="task-input">
                    <input
                        type="text"
                        id="taskInput"
                        placeholder="What needs to be done?"
                        aria-label="New task"
                        required
                    >
                    <button type="submit" class="add-btn">Add Task +</button>
                </div>
            </form>

            <div class="task-summary">
                <strong>Today's list</strong>
                <span id="taskCount">0 pending</span>
            </div>

            <div id="taskList" aria-live="polite">
                <p class="empty-message">Your list is empty. Add your first task!</p>
            </div>
        </section>
    </main>

    <footer>
        Daily Task Planner | Created by Suhani
    </footer>

    <script>
        const taskForm = document.getElementById("taskForm");
        const taskInput = document.getElementById("taskInput");
        const taskList = document.getElementById("taskList");
        const taskCount = document.getElementById("taskCount");

        let tasks = [];

        function updateTasks() {
            taskList.innerHTML = "";

            const pending = tasks.filter(function(task) {
                return !task.completed;
            }).length;

            taskCount.textContent = pending + " pending";

            if (tasks.length === 0) {
                taskList.innerHTML =
                    '<p class="empty-message">Your list is empty. Add your first task!</p>';
                return;
            }

            tasks.forEach(function(task) {
                const taskItem = document.createElement("div");
                taskItem.className = "task-item";

                if (task.completed) {
                    taskItem.classList.add("completed");
                }

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = task.completed;
                checkbox.setAttribute("aria-label", "Mark task as complete");

                checkbox.addEventListener("change", function() {
                    task.completed = checkbox.checked;
                    updateTasks();
                });

                const taskText = document.createElement("span");
                taskText.className = "task-text";
                taskText.textContent = task.name;

                taskText.addEventListener("click", function() {
                    task.completed = !task.completed;
                    updateTasks();
                });

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "Delete";
                deleteButton.setAttribute("aria-label", "Delete " + task.name);

                deleteButton.addEventListener("click", function() {
                    tasks = tasks.filter(function(item) {
                        return item.id !== task.id;
                    });

                    updateTasks();
                });

                taskItem.appendChild(checkbox);
                taskItem.appendChild(taskText);
                taskItem.appendChild(deleteButton);

                taskList.appendChild(taskItem);
            });
        }

        taskForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const name = taskInput.value.trim();

            if (name === "") {
                return;
            }

            tasks.push({
                id: Date.now(),
                name: name,
                completed: false
            });

            taskInput.value = "";
            updateTasks();
            taskInput.focus();
        });
    </script>

</body>
</html>
