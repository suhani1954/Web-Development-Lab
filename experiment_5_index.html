<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Window</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #f4f8fc;
            font-family: Arial, sans-serif;
            color: #26364a;
        }

        .top-bar {
            background: #26364a;
            color: white;
            padding: 20px 0;
        }

        .brand {
            font-size: 25px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 45px 15px 25px;
        }

        .hero h1 {
            font-size: 38px;
            font-weight: bold;
        }

        .hero p {
            color: #66758a;
        }

        .weather-box {
            max-width: 650px;
            margin: 20px auto 50px;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(38, 54, 74, 0.08);
        }

        .search-area {
            display: flex;
            gap: 10px;
        }

        .search-area input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccd6e2;
            border-radius: 8px;
        }

        .search-area button {
            padding: 12px 20px;
            background: #ed987b;
            color: #26364a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-area button:hover {
            background: #e78362;
        }

        .popular-cities {
            margin-top: 22px;
        }

        .popular-cities p {
            font-size: 14px;
            color: #66758a;
            margin-bottom: 10px;
        }

        .city-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .city-btn {
            border: 1px solid #d5e0ec;
            background: #f4f8fc;
            color: #26364a;
            padding: 7px 13px;
            border-radius: 20px;
            cursor: pointer;
        }

        .city-btn:hover {
            background: #ed987b;
            border-color: #ed987b;
        }

        #weatherResult {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background: #edf5fb;
            border-radius: 14px;
            text-align: center;
        }

        .weather-icon {
            font-size: 55px;
        }

        .temperature {
            font-size: 48px;
            font-weight: bold;
        }

        .details {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 25px;
        }

        .detail-item {
            padding: 15px;
            background: white;
            border-radius: 10px;
            min-width: 130px;
        }

        #message {
            margin-top: 15px;
            color: #b34b3c;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #26364a;
            color: white;
        }

        @media (max-width: 500px) {
            .hero h1 {
                font-size: 30px;
            }

            .weather-box {
                margin: 15px;
                padding: 20px;
            }

            .search-area {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header class="top-bar">
        <div class="container">
            <div class="brand">Weather Window ☁️</div>
            <small>A little update from the sky</small>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>What's the weather like?</h1>
            <p>Enter a city to check its current weather conditions.</p>
        </section>

        <section class="weather-box">

            <form id="weatherForm">
                <div class="search-area">
                    <input
                        type="text"
                        id="cityInput"
                        placeholder="Enter city name"
                        aria-label="City name"
                        required
                    >
                    <button type="submit">Check Weather</button>
                </div>
            </form>

            <div class="popular-cities">
                <p>Popular Cities</p>

                <div class="city-list">
                    <button type="button" class="city-btn" data-city="Saharanpur">Saharanpur</button>
                    <button type="button" class="city-btn" data-city="Delhi">Delhi</button>
                    <button type="button" class="city-btn" data-city="Mumbai">Mumbai</button>
                    <button type="button" class="city-btn" data-city="Bengaluru">Bengaluru</button>
                    <button type="button" class="city-btn" data-city="London">London</button>
                    <button type="button" class="city-btn" data-city="New York">New York</button>
                    <button type="button" class="city-btn" data-city="Tokyo">Tokyo</button>
                </div>
            </div>

            <p id="message" role="status"></p>

            <div id="weatherResult">
                <h2 id="cityName"></h2>

                <div class="weather-icon" id="weatherIcon">🌤️</div>
                <div class="temperature" id="temperature"></div>
                <p id="description"></p>

                <div class="details">
                    <div class="detail-item">
                        <strong>Feels Like</strong>
                        <p id="feelsLike"></p>
                    </div>

                    <div class="detail-item">
                        <strong>Humidity</strong>
                        <p id="humidity"></p>
                    </div>

                    <div class="detail-item">
                        <strong>Wind Speed</strong>
                        <p id="windSpeed"></p>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <footer>
        <p class="mb-0">Weather Window | Made by Suhani</p>
    </footer>

    <script>
        const form = document.getElementById("weatherForm");
        const cityInput = document.getElementById("cityInput");
        const message = document.getElementById("message");
        const weatherResult = document.getElementById("weatherResult");

        function getWeatherInfo(code) {
            if (code === 0) return ["☀️", "Clear sky"];
            if (code === 1 || code === 2) return ["🌤️", "Mostly clear"];
            if (code === 3) return ["☁️", "Cloudy"];
            if (code === 45 || code === 48) return ["🌫️", "Foggy"];
            if (code >= 51 && code <= 57) return ["🌦️", "Drizzle"];
            if (code >= 61 && code <= 67) return ["🌧️", "Rainy"];
            if (code >= 71 && code <= 77) return ["❄️", "Snowfall"];
            if (code >= 80 && code <= 82) return ["🌧️", "Rain showers"];
            if (code >= 95) return ["⛈️", "Thunderstorm"];

            return ["🌥️", "Changeable weather"];
        }

        async function showWeather(city) {
            message.textContent = "Checking the weather...";
            weatherResult.style.display = "none";

            try {
                const locationResponse = await fetch(
                    "https://geocoding-api.open-meteo.com/v1/search?name=" +
                    encodeURIComponent(city) +
                    "&count=1&language=en&format=json"
                );

                if (!locationResponse.ok) {
                    throw new Error("Unable to find the city. Please try again.");
                }

                const locationData = await locationResponse.json();

                if (!locationData.results || locationData.results.length === 0) {
                    throw new Error("City not found. Please try another name.");
                }

                const place = locationData.results[0];

                const weatherResponse = await fetch(
                    "https://api.open-meteo.com/v1/forecast?latitude=" +
                    place.latitude +
                    "&longitude=" +
                    place.longitude +
                    "&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code"
                );

                if (!weatherResponse.ok) {
                    throw new Error("Unable to get weather data right now.");
                }

                const weatherData = await weatherResponse.json();
                const current = weatherData.current;
                const weatherInfo = getWeatherInfo(current.weather_code);

                document.getElementById("cityName").textContent =
                    place.name + (place.country ? ", " + place.country : "");

                document.getElementById("weatherIcon").textContent = weatherInfo[0];

                document.getElementById("temperature").textContent =
                    Math.round(current.temperature_2m) + "°C";

                document.getElementById("description").textContent = weatherInfo[1];

                document.getElementById("feelsLike").textContent =
                    Math.round(current.apparent_temperature) + "°C";

                document.getElementById("humidity").textContent =
                    current.relative_humidity_2m + "%";

                document.getElementById("windSpeed").textContent =
                    current.wind_speed_10m + " km/h";

                weatherResult.style.display = "block";
                message.textContent = "";

            } catch (error) {
                message.textContent =
                    error.message || "Something went wrong. Please try again.";
            }
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const city = cityInput.value.trim();

            if (city === "") {
                message.textContent = "Please enter a city name.";
                return;
            }

            showWeather(city);
        });

        document.querySelectorAll(".city-btn").forEach(function(button) {
            button.addEventListener("click", function() {
                cityInput.value = button.dataset.city;
                showWeather(button.dataset.city);
            });
        });
    </script>

</body>
</html>
